<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 160" role="img" aria-label="wave-alpha">
  <title>wave-alpha — Elliott Wave engine</title>

  <!-- Wave glyph: 5-wave Elliott impulse 0→1→2→3→4→5 -->
  <g transform="translate(28 28)">
    <!-- Baseline reference -->
    <line x1="0" y1="100" x2="232" y2="100" stroke="#cbd5e1" stroke-width="1.25" stroke-dasharray="3 5"/>

    <!-- Impulse path -->
    <path d="M 0 92 L 42 56 L 68 74 L 152 20 L 184 44 L 232 8"
          fill="none" stroke="#1e293b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Wave 3 emphasis (longest impulse) -->
    <path d="M 68 74 L 152 20"
          fill="none" stroke="#6366f1" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Pivot dots -->
    <circle cx="0"   cy="92" r="3.5" fill="#1e293b"/>
    <circle cx="42"  cy="56" r="3.5" fill="#1e293b"/>
    <circle cx="68"  cy="74" r="3.5" fill="#1e293b"/>
    <circle cx="152" cy="20" r="5"   fill="#6366f1"/>
    <circle cx="184" cy="44" r="3.5" fill="#1e293b"/>
    <circle cx="232" cy="8"  r="4"   fill="#1e293b"/>

    <!-- Wave count labels -->
    <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#475569">
      <text x="42"  y="46"  text-anchor="middle">1</text>
      <text x="68"  y="89"  text-anchor="middle">2</text>
      <text x="152" y="11"  text-anchor="middle" fill="#6366f1">3</text>
      <text x="184" y="59"  text-anchor="middle">4</text>
      <text x="232" y="-2"  text-anchor="middle">5</text>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif"
     font-weight="700" letter-spacing="-0.02em">
    <text x="300" y="92" font-size="48" fill="#0f172a">wave-<tspan fill="#6366f1">alpha</tspan></text>
    <text x="302" y="120" font-size="14" font-weight="500" letter-spacing="0.02em" fill="#64748b">
      Elliott Wave engine for swing traders
    </text>
  </g>
</svg>
