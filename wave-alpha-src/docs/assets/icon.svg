<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="wave-alpha icon">
  <title>wave-alpha</title>

  <!-- Rounded square background -->
  <rect x="2" y="2" width="124" height="124" rx="22" ry="22"
        fill="#0f172a" stroke="#1e293b" stroke-width="1"/>

  <!-- Subtle baseline -->
  <line x1="20" y1="84" x2="108" y2="84" stroke="#334155" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- 5-wave impulse, scaled to fit -->
  <g stroke-linejoin="round" stroke-linecap="round" fill="none">
    <!-- Full impulse path -->
    <path d="M 18 80 L 36 56 L 50 67 L 80 30 L 92 47 L 110 22"
          stroke="#e2e8f0" stroke-width="3"/>
    <!-- Wave 3 emphasis -->
    <path d="M 50 67 L 80 30" stroke="#a5b4fc" stroke-width="3.5"/>
  </g>

  <!-- Pivot dots -->
  <g>
    <circle cx="18"  cy="80" r="2.5" fill="#e2e8f0"/>
    <circle cx="36"  cy="56" r="2.5" fill="#e2e8f0"/>
    <circle cx="50"  cy="67" r="2.5" fill="#e2e8f0"/>
    <circle cx="80"  cy="30" r="3.5" fill="#a5b4fc"/>
    <circle cx="92"  cy="47" r="2.5" fill="#e2e8f0"/>
    <circle cx="110" cy="22" r="3"   fill="#e2e8f0"/>
  </g>

  <!-- Greek alpha mark in lower-right corner -->
  <text x="98" y="108" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="22" font-weight="700" fill="#a5b4fc">α</text>
</svg>
