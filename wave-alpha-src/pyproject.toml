[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wave-alpha"
version = "0.14.3"
description = "Local-first Elliott Wave analysis for swing traders"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Alex Chen" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "elliott-wave",
  "trading",
  "swing-trading",
  "technical-analysis",
  "backtest",
  "stocks",
  "finance",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.6",
  "sqlmodel>=0.0.16",
  "typer[all]>=0.12",
  "yfinance>=0.2.40",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "factory-boy>=3.3",
  "ruff>=0.4",
]
llm = [
  "anthropic>=0.39",
]
ui = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.scripts]
wave-alpha = "wave_alpha.cli.app:app"

[project.urls]
Homepage = "https://github.com/chen-star/wave-alpha"
Repository = "https://github.com/chen-star/wave-alpha"
Issues = "https://github.com/chen-star/wave-alpha/issues"
Changelog = "https://github.com/chen-star/wave-alpha/blob/main/CHANGELOG.md"












[tool.hatch.build.targets.wheel]
packages = ["src/wave_alpha"]
# `packages` already includes every file under src/wave_alpha (Python and
# non-Python). A separate force-include here would re-add the same files and
# produce duplicate entries in the wheel zip — PyPI's warehouse rejects that
# with "400 Invalid distribution file. Duplicate filename in local headers."

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not network'"
markers = [
  "slow: tests that build wheels or hit subprocess (deselect with '-m \"not slow\"')",
  "network: tests that hit live external endpoints (opt in with '-m network')",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/wave_alpha/__init__.py:__version__"]
branch = "main"
build_command = ""
tag_format = "v{version}"
commit_message = "chore(release): {version}"
allow_zero_version = true

[tool.semantic_release.changelog]
mode = "update"

